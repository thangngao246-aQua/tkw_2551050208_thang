<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Nhập / Đăng Ký - JobSupport</title>
  <script>(function(){const s=localStorage.getItem("theme"),d=s?s==="dark":window.matchMedia("(prefers-color-scheme: dark)").matches;document.documentElement.classList.toggle("dark",d);})();</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={darkMode:'class',theme:{extend:{colors:{brand:{600:'#7c3aed',700:'#6d28d9'}}}}}</script>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-slate-100 font-sans min-h-screen flex flex-col justify-between">

  <!-- Header đơn giản -->
  <header class="p-5 border-b border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900">
    <div class="max-w-6xl mx-auto flex items-center justify-between">
      <a href="index.html" class="font-bold text-xl text-purple-600 dark:text-purple-400">JobSupport</a>
      <a href="index.html" class="text-sm font-semibold hover:underline">← Quay lại Trang Chủ</a>
    </div>
  </header>

  <!-- Form Container -->
  <main class="flex-1 flex items-center justify-center p-5 my-8">
    <div class="w-full max-w-md bg-white dark:bg-slate-800 p-8 rounded-2xl shadow-xl border border-slate-200 dark:border-slate-700">
      
      <!-- Tab Chuyển Đổi Đăng Nhập / Đăng Ký -->
      <div class="flex border-b border-slate-200 dark:border-slate-700 mb-6">
        <button id="tab-login" type="button" class="flex-1 pb-3 text-center font-bold text-purple-600 border-b-2 border-purple-600">Đăng Nhập</button>
        <button id="tab-register" type="button" class="flex-1 pb-3 text-center font-bold text-slate-400 border-b-2 border-transparent hover:text-slate-600">Đăng Ký</button>
      </div>

      <!-- FORM ĐĂNG NHẬP -->
      <form id="form-login" class="space-y-4">
        <div>
          <label for="login-email" class="block text-sm font-semibold mb-1">Email *</label>
          <input type="email" id="login-email" required class="w-full p-3 rounded-xl border border-slate-300 dark:border-slate-700 bg-transparent text-sm focus:outline-none focus:border-purple-600" placeholder="nguyenvana@gmail.com">
        </div>
        <div>
          <label for="login-password" class="block text-sm font-semibold mb-1">Mật khẩu *</label>
          <input type="password" id="login-password" required class="w-full p-3 rounded-xl border border-slate-300 dark:border-slate-700 bg-transparent text-sm focus:outline-none focus:border-purple-600" placeholder="••••••••">
        </div>
        <div class="flex items-center justify-between text-xs">
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" class="rounded text-purple-600"> Ghi nhớ đăng nhập
          </label>
          <a href="#" class="text-purple-600 hover:underline">Quên mật khẩu?</a>
        </div>
        <button type="submit" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-semibold py-3 rounded-xl transition-all">Đăng Nhập</button>
      </form>

      <!-- FORM ĐĂNG KÝ (ẨN MẶC ĐỊNH) -->
      <form id="form-register" class="space-y-4 hidden">
        <div>
          <label for="reg-name" class="block text-sm font-semibold mb-1">Họ và tên *</label>
          <input type="text" id="reg-name" required class="w-full p-3 rounded-xl border border-slate-300 dark:border-slate-700 bg-transparent text-sm focus:outline-none focus:border-purple-600" placeholder="Nguyễn Văn A">
        </div>
        <div>
          <label for="reg-email" class="block text-sm font-semibold mb-1">Email *</label>
          <input type="email" id="reg-email" required class="w-full p-3 rounded-xl border border-slate-300 dark:border-slate-700 bg-transparent text-sm focus:outline-none focus:border-purple-600" placeholder="nguyenvana@gmail.com">
        </div>
        <div>
          <label for="reg-password" class="block text-sm font-semibold mb-1">Mật khẩu *</label>
          <input type="password" id="reg-password" required class="w-full p-3 rounded-xl border border-slate-300 dark:border-slate-700 bg-transparent text-sm focus:outline-none focus:border-purple-600" placeholder="••••••••">
        </div>
        <button type="submit" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-semibold py-3 rounded-xl transition-all">Tạo Tài Khoản</button>
      </form>

    </div>
  </main>

  <footer class="p-4 text-center text-xs text-slate-400">
    © 2026 JobSupport. Tất cả quyền được bảo lưu.
  </footer>

  <!-- SCRIPT XỬ LÝ -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const tabLogin = document.getElementById("tab-login");
      const tabRegister = document.getElementById("tab-register");
      const formLogin = document.getElementById("form-login");
      const formRegister = document.getElementById("form-register");

      // Chuyển tab Đăng Nhập
      tabLogin.addEventListener("click", () => {
        tabLogin.className = "flex-1 pb-3 text-center font-bold text-purple-600 border-b-2 border-purple-600";
        tabRegister.className = "flex-1 pb-3 text-center font-bold text-slate-400 border-b-2 border-transparent hover:text-slate-600";
        formLogin.classList.remove("hidden");
        formRegister.classList.add("hidden");
      });

      // Chuyển tab Đăng Ký
      tabRegister.addEventListener("click", () => {
        tabRegister.className = "flex-1 pb-3 text-center font-bold text-purple-600 border-b-2 border-purple-600";
        tabLogin.className = "flex-1 pb-3 text-center font-bold text-slate-400 border-b-2 border-transparent hover:text-slate-600";
        formRegister.classList.remove("hidden");
        formLogin.classList.add("hidden");
      });

      // Xử lý Submit Đăng Nhập
      formLogin.addEventListener("submit", (e) => {
        e.preventDefault();
        const email = document.getElementById("login-email").value;
        localStorage.setItem("user_logged_in", email);
        alert("Đăng nhập thành công!");
        window.location.href = "index.html";
      });

      // Xử lý Submit Đăng Ký
      formRegister.addEventListener("submit", (e) => {
        e.preventDefault();
        alert("Tạo tài khoản thành công! Hãy đăng nhập ngay.");
        tabLogin.click();
      });
    });
  </script>
</body>
</html>
